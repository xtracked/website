[project]
site_name = "Xtracked"
site_description = "Xtracked helpt complexe technische vraagstukken te begrijpen, te structureren en te realiseren"
site_author = "Xtracked"
site_url = "https://xtracked.com"
repo_url = "https://github.com/xtracked/website"
edit_uri = "blob/main/docs/"
copyright = """
Copyright &copy; 2026 Xtracked |
<a href="/algemene-voorwaarden">Algemene voorwaarden</a> |
<a href="/privacybeleid">Privacybeleid</a>
"""
nav = [
    { "Home" = "index.md" },
    { "Werkwijze" = "werkwijze.md" },
    { "Projecten" = [
        "projecten/index.md",
        { "SPIN remote" = "projecten/spin-remote.md" },
        { "FunQL" = "projecten/funql.md" },
        { "ZorgAPIs" = "projecten/zorgapis.md" },
    ] },
    { "Over" = "over.md" },
    { "Contact" = "contact.md" },
]
extra_css = [
    "stylesheets/extra.css",
]

# Theme options
[project.theme]
language = "nl"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "search.highlight",
    "toc.follow",
]
font.text = "Inter"
font.code = "JetBrains Mono"
logo = "assets/xtracked-icon.svg"
favicon = "assets/favicon.png"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Lichte modus gebruiken"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Donkere modus gebruiken"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Systeeminstelling gebruiken"

# Miscellaneous settings
[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/company/xtracked"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/xtracked"

# Markdown extensions
[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
toc = {
    permalink = true,
}
pymdownx.details = {}
pymdownx.emoji = {
    emoji_generator = "zensical.extensions.emoji.to_svg",
    emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
    anchor_linenums = true,
    line_spans = "__span",
    pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.snippets = {
    base_path = "docs",
}
pymdownx.superfences = {
    custom_fences = [
        {
            name = "mermaid",
            class = "mermaid",
            format = "pymdownx.superfences.fence_code_format",
        },
    ],
}
pymdownx.tabbed = {
    alternate_style = true,
    combine_header_slug = true,
    slugify = {
        object = "pymdownx.slugs.slugify",
        kwds.case = "lower",
    },
}
zensical.extensions.glightbox = {
    auto_themed = true,
}