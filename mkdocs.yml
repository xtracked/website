# Project information
site_name: Xtracked
site_description: Xtracked helpt complexe technische vraagstukken te begrijpen, te structureren en te realiseren
site_author: Xtracked
site_url: https://xtracked.com/

# Repository
repo_url: https://github.com/xtracked/website
edit_uri: blob/main/docs/

# Copyright
copyright: >-
  Copyright &copy; 2026 Xtracked |
  <a href="/algemene-voorwaarden">Algemene voorwaarden</a> |
  <a href="/privacybeleid">Privacybeleid</a>

# Configuration
theme:
  name: material
  language: nl
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Donkere modus inschakelen
      primary: indigo
      accent: indigo
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Lichte modus inschakelen
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - content.tabs.link
    - toc.follow
  font:
    text: Roboto
    code: JetBrains Mono
  logo: assets/xtracked-icon.svg
  favicon: assets/favicon.png

# Plugins
plugins:
  - search
  - glightbox:
      auto_themed: true

# Additional configuration
extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/xtracked
    - icon: fontawesome/brands/github
      link: https://github.com/xtracked

# Additional CSS
extra_css:
  - stylesheets/extra.css

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

# Page tree
nav:
  - Home: index.md
  - Werkwijze: werkwijze.md
  - Projecten:
      - projecten/index.md
      - SPIN remote: projecten/spin-remote.md
      - FunQL: projecten/funql.md
      - ZorgAPIs: projecten/zorgapis.md
  - Over: over.md
  - Contact: contact.md